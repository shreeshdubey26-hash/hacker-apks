<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKER APKs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Top Header -->
    <div style="background: #09090b; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #27272a;">
        <div style="display: flex; align-items: center; gap: 10px; color: #22c55e; font-weight: bold; font-size: 18px;">
            <i class="fa-solid fa-user-secret"></i> HACKER APKs
        </div>
        <div style="display: flex; gap: 15px; font-size: 20px; color: #fff; cursor: pointer;">
            <i class="fa-solid fa-house" onclick="showPage('home')"></i>
            <i class="fa-solid fa-gear" onclick="showPage('admin')"></i>
        </div>
    </div>

    <!-- HOME PAGE -->
    <div id="home" class="page">
        <div style="text-align: center; padding: 20px; color: #ef4444; font-weight: bold; font-size: 22px;">
            >_ ROOT ACCESS
        </div>
        <div style="padding: 0 15px;">
            <input type="text" id="searchInput" placeholder="Search apps..." onkeyup="searchApps()" style="width: 100%; padding: 12px; background: #18181b; border: 1px solid #27272a; color: #fff; border-radius: 8px; margin-bottom: 15px;">
        </div>
        <div id="app-list"></div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin" class="page hidden">
        <div class="admin-box" style="padding: 20px; margin: 15px; background: #121214; border: 1px dashed #ef4444; border-radius: 12px;">
            <h2 style="color: #ef4444; text-align: center; margin-top: 0;"><i class="fa-solid fa-terminal"></i> ADMIN DASHBOARD</h2>
            
            <label style="color: #a1a1aa; font-size: 14px;">App Name</label>
            <input type="text" id="appName" placeholder="e.g. CapCut Pro Mod v3" style="width: 100%; padding: 10px; margin: 5px 0 15px 0; background: #18181b; border: 1px solid #27272a; color: #fff; border-radius: 6px;">

            <label style="color: #a1a1aa; font-size: 14px;">App Logo Direct URL (Image Link)</label>
            <input type="text" id="appLogoUrl" placeholder="https://... (image link yahan dalein)" style="width: 100%; padding: 10px; margin: 5px 0 15px 0; background: #18181b; border: 1px solid #27272a; color: #fff; border-radius: 6px;">

            <label style="color: #a1a1aa; font-size: 14px;">Category & Size</label>
            <input type="text" id="appSize" placeholder="e.g. Video Editor • 150 MB" style="width: 100%; padding: 10px; margin: 5px 0 15px 0; background: #18181b; border: 1px solid #27272a; color: #fff; border-radius: 6px;">

            <label style="color: #a1a1aa; font-size: 14px;">Description</label>
            <textarea id="appDesc" placeholder="Write full app details here..." rows="4" style="width: 100%; padding: 10px; margin: 5px 0 15px 0; background: #18181b; border: 1px solid #27272a; color: #fff; border-radius: 6px;"></textarea>

            <label style="color: #a1a1aa; font-size: 14px;">Google Drive Download Link</label>
            <input type="text" id="appDrive" placeholder="https://drive.google.com/file/d/..." style="width: 100%; padding: 10px; margin: 5px 0 15px 0; background: #18181b; border: 1px solid #27272a; color: #fff; border-radius: 6px;">

            <button class="btn" style="width: 100%; padding: 12px; background: #ef4444; color: #fff; border: none; font-weight: bold; border-radius: 6px; cursor: pointer;" onclick="publishApp()">
                <i class="fa-solid fa-rocket"></i> PUBLISH NEW VERSION
            </button>
        </div>

        <div style="padding: 0 15px 20px 15px;">
            <h3 style="color: #22c55e; font-size: 15px; margin-bottom: 10px;">Manage & Delete Apps:</h3>
            <div id="admin-app-list"></div>
        </div>
    </div>

    <!-- APP DETAILS PAGE -->
    <div id="app-details" class="page hidden" style="padding: 20px; color: #fff;">
        <button onclick="showPage('home')" style="background: #27272a; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 20px;"><i class="fa-solid fa-arrow-left"></i> Back</button>
        <h2 id="detail-title" style="color: #22c55e;"></h2>
        <img id="detail-logo" src="" style="width: 80px; height: 80px; border-radius: 12px; margin: 10px 0;">
        <p id="detail-size" style="color: #a1a1aa;"></p>
        <p id="detail-category" style="color: #ef4444; font-weight: bold;"></p>
        <p id="detail-desc" style="margin: 15px 0; line-height: 1.5;"></p>
        <a id="detail-download" href="#" target="_blank" style="display: inline-block; background: #22c55e; color: #000; padding: 12px 25px; font-weight: bold; text-decoration: none; border-radius: 8px; margin-top: 15px;">DOWNLOAD APK</a>
    </div>
    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #050507; color: #e4e4e7; }
    .hidden { display: none !important; }
    .app-card { background: #121214; border: 1px solid #27272a; border-radius: 12px; padding: 12px; margin: 10px 15px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .app-card:active { background: #18181b; }
    .app-info { display: flex; align-items: center; gap: 12px; }
    .app-icon { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; }
    .manage-item { background: #121214; border: 1px solid #27272a; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    </style>
    <script>
    let apps = JSON.parse(localStorage.getItem('hacker_apps')) || [
        {
            name: "CapCut Pro Edits",
            logo: "https://play-lh.googleusercontent.com/RSuaRLti_FlDB8dMmJ23ru3Og5hSxb9AspaGTMZ2gGtR3Mvj3ARnoFz",
            size: "344.78 MB",
            category: "Video Editor",
            desc: "Premium Video Editor without watermark. All pro effects and transitions unlocked.",
            drive: "https://drive.google.com/file/d/1eNkfcc12cYlUo0IHgGLX8RyjT4BDglOqzyZ/view?usp=drive_sdk"
        }
    ];

    function renderApps() {
        let list = document.getElementById('app-list');
        let adminList = document.getElementById('admin-app-list');
        if (!list) return;

        list.innerHTML = "";
        adminList.innerHTML = "";

        apps.forEach((app, index) => {
            // Home App Card
            let div = document.createElement('div');
            div.className = "app-card";
            div.onclick = () => openApp(app.name, app.logo, app.size, app.category, app.desc, app.drive);
            div.innerHTML = `
                <div class="app-info">
                    <img src="${app.logo}" class="app-icon" alt="icon">
                    <div>
                        <h3 style="font-size: 16px; color: #fff;">${app.name}</h3>
                        <p style="font-size: 12px; color: #a1a1aa;"><i class="fa-solid fa-star" style="color: #eab308;"></i> 4.9 • ${app.size}</p>
                    </div>
                </div>
                <div style="background: #27272a; padding: 6px 12px; font-size: 14px; border-radius: 6px; color: #fff; font-weight: bold;">GET</div>
            `;
            list.appendChild(div);

            // Admin Management List Item
            let adminItem = document.createElement('div');
            adminItem.className = "manage-item";
            adminItem.innerHTML = `
                <span style="font-weight: 600; font-size: 14px; color: #fff;">${app.name}</span>
                <button style="background: #ef4444; color: #fff; border: none; padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer;" onclick="deleteApp(${index})">
                    <i class="fa-solid fa-trash"></i> DELETE
                </button>
            `;
            adminList.appendChild(adminItem);
        });
    }

    function publishApp() {
        let name = document.getElementById('appName').value;
        let size = document.getElementById('appSize').value;
        let desc = document.getElementById('appDesc').value;
        let drive = document.getElementById('appDrive').value;
        let logoUrl = document.getElementById('appLogoUrl').value;

        if (!name || !drive) {
            alert('App Name aur Google Drive link dalna zaroori hai!');
            return;
        }

        let newApp = {
            name: name,
            logo: logoUrl || "https://via.placeholder.com/60",
            size: size || "50 MB",
            category: "Mod App",
            desc: desc || "No description provided.",
            drive: drive
        };

        apps.push(newApp);
        localStorage.setItem('hacker_apps', JSON.stringify(apps));
        alert('App Published Successfully! 🎉');

        document.getElementById('appName').value = "";
        document.getElementById('appSize').value = "";
        document.getElementById('appDesc').value = "";
        document.getElementById('appDrive').value = "";
        document.getElementById('appLogoUrl').value = "";

        renderApps();
        showPage('home');
    }

    function deleteApp(index) {
        if (confirm('Kya aap waqai is app ko delete karna chahte hain?')) {
            apps.splice(index, 1);
            localStorage.setItem('hacker_apps', JSON.stringify(apps));
            renderApps();
            alert('App Deleted Successfully! 🗑️');
        }
    }

    function showPage(pageId) {
        document.getElementById('home').classList.add('hidden');
        document.getElementById('admin').classList.add('hidden');
        document.getElementById('app-details').classList.add('hidden');

        let targetPage = document.getElementById(pageId);
        if (targetPage) {
            targetPage.classList.remove('hidden');
        }
        window.scrollTo(0, 0);
    }

    function openApp(title, logoUrl, size, category, desc, downloadLink) {
        document.getElementById('detail-title').innerText = title;
        document.getElementById('detail-logo').src = logoUrl;
        document.getElementById('detail-size').innerText = size;
        document.getElementById('detail-category').innerText = category;
        document.getElementById('detail-desc').innerText = desc;
        document.getElementById('detail-download').href = downloadLink;
        showPage('app-details');
    }

    function searchApps() {
        let filter = document.getElementById('searchInput').value.toUpperCase();
        let cards = document.getElementsByClassName('app-card');
        for (let i = 0; i < cards.length; i++) {
            let title = cards[i].querySelector('h3').innerText;
            if (title.toUpperCase().indexOf(filter) > -1) {
                cards[i].style.display = "flex";
            } else {
                cards[i].style.display = "none";
            }
        }
    }

    // Run on load
    window.onload = function() {
        renderApps();
    };
</script>

</body>
</html>
